<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume — Nathan Setaro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --surface: #ffffff; --ink: #0d2028; --muted: #5b7481;
    --line: #d3dee4; --accent: #0c7f8c;
    --glass: rgba(255,255,255,0.5); --glass-brd: rgba(255,255,255,0.9);
    --glass-shadow: 0 24px 60px -26px rgba(21,70,88,0.20), 0 2px 8px rgba(21,70,88,0.04);
    --glass-blur: blur(26px) saturate(185%);
  }
  html.dark {
    --bg: #06161d; --surface: rgba(255,255,255,0.04); --ink: #e9f3f5; --muted: #8ba7b0;
    --line: rgba(238,246,247,0.15); --accent: #4fd0de;
    --glass: rgba(255,255,255,0.045); --glass-brd: rgba(255,255,255,0.09);
    --glass-shadow: 0 24px 60px -26px rgba(0,0,0,0.6);
    --glass-blur: blur(20px) saturate(130%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; }
  body { font-family: 'Instrument Sans', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; transition: background 0.4s ease, color 0.4s ease; }
  a { color: var(--ink); text-decoration: none; transition: color 0.2s ease, border-color 0.2s ease; }
  a:hover { color: var(--accent); }
  ::selection { background: var(--accent); color: var(--bg); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .hv-brd:hover { border-color: var(--accent) !important; }
  .hv-white:hover { color: #fff !important; }
  @media (max-width: 700px) {
    nav { padding: 14px 20px !important; }
    main { padding: 32px 20px 72px !important; }
    .navlabel { display: none; }
  }
</style>
  <script>try{if(sessionStorage.getItem("nds-theme")==="dark")document.documentElement.classList.add("dark");}catch(e){}</script>
</head>
<body>

<div style="min-height: 100vh; min-height: 100svh; width: 100%; position: relative;">
  <nav style="position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 18px 48px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid var(--line);">
    <a href="index.html" style="font-family: 'Newsreader', serif; font-size: 19px; font-weight: 500;">Nathan Setaro</a>
    <div style="display: flex; gap: 12px; align-items: center;">
      <a href="index.html" class="hv-brd" aria-label="Back to site" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 8px 16px; border: 1px solid var(--line); border-radius: 100px;">← <span class="navlabel">Back to site</span></a>
      <a href="assets/resume.pdf" download="Nathan Setaro Resume.pdf" class="hv-white" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; background: var(--accent); padding: 8px 18px; border-radius: 100px;">Download PDF</a>
      <button id="theme-toggle" title="Dark mode" aria-label="Toggle dark mode" aria-pressed="false" class="hv-brd" style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); cursor: pointer; padding: 0; transition: border-color 0.3s ease;">
        <span id="theme-dot" style="width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink); background: linear-gradient(90deg, var(--ink) 0 50%, transparent 50% 100%); transform: rotate(0deg); transition: transform 0.6s cubic-bezier(0.16,1,0.3,1);"></span>
      </button>
    </div>
  </nav>

  <main style="max-width: 960px; margin: 0 auto; padding: 56px 48px 110px; position: relative;">
    <div style="display: flex; align-items: baseline; gap: 24px; margin-bottom: 36px;">
      <h1 style="font-family: 'Newsreader', serif; font-weight: 400; font-size: 44px; letter-spacing: -0.02em;">Resume</h1>
      <div style="flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent);"></div>
    </div>
    <div style="padding: 20px; border-radius: 26px; background: var(--glass); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-brd); box-shadow: var(--glass-shadow);">
      <img src="assets/resume.png" width="1500" height="1941" alt="Nathan Setaro's one-page resume: education, experience, projects, skills, certifications, awards and volunteer work. Download the PDF for a text version." style="display: block; width: 100%; border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); border-radius: 8px; background: #ffffff;">
    </div>
    <p style="margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center;">Viewer not loading? <a href="assets/resume.pdf" download="Nathan Setaro Resume.pdf" style="color: var(--accent); font-weight: 600;">Download the PDF</a>.</p>
  </main>
</div>

<script>
(function () {
  var root = document.documentElement, isDark = false;
  try { isDark = sessionStorage.getItem('nds-theme') === 'dark'; } catch (e) {}
  var tgl = document.getElementById('theme-toggle'), dot = document.getElementById('theme-dot');
  function sync() {
    root.classList.toggle('dark', isDark);
    dot.style.transform = 'rotate(' + (isDark ? 180 : 0) + 'deg)';
    tgl.title = (isDark ? 'Light' : 'Dark') + ' mode';
    tgl.setAttribute('aria-pressed', String(isDark));
  }
  sync();
  tgl.addEventListener('click', function () {
    isDark = !isDark;
    try { sessionStorage.setItem('nds-theme', isDark ? 'dark' : 'light'); } catch (e) {}
    sync();
  });
})();
</script>
</body>
</html>
