<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume, Nathan Setaro</title>
<meta name="description" content="Resume of Nathan Setaro, Industrial & Systems Engineering student at Auburn University.">
<meta name="theme-color" content="#ffffff">
<style>
  @font-face { font-family: 'Instrument Sans'; font-style: normal; font-weight: 400 600; font-display: swap;
    src: url("assets/fonts/instrument-sans-latin.woff2") format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Instrument Sans'; font-style: normal; font-weight: 400 600; font-display: swap;
    src: url("assets/fonts/instrument-sans-latin-ext.woff2") format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 300 600; font-display: swap;
    src: url("assets/fonts/newsreader-latin.woff2") format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  :root {
    color-scheme: light;
    --bg: #ffffff; --tone: #eef4f5; --tone-2: #e2ecee;
    --ink: #0d2028; --muted: #4f6873;
    --accent: #0b7783; --on-accent: #ffffff;
    --serif: 'Newsreader', Georgia, serif;
    --sans: 'Instrument Sans', system-ui, sans-serif;
    --gutter: clamp(20px, 4vw, 48px);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  html.dark {
    color-scheme: dark;
    --bg: #06161d; --tone: #0d2530; --tone-2: #143341;
    --ink: #e9f3f5; --muted: #a3bcc4;
    --accent: #4fd0de; --on-accent: #06161d;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); font-size: 17px; line-height: 1.6; background: var(--bg); color: var(--ink); transition: background-color 0.4s ease, color 0.4s ease; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  img { display: block; max-width: 100%; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  ::selection { background: var(--accent); color: var(--on-accent); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--gutter); }

  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 100px; font-weight: 600; white-space: nowrap; transition: transform 0.2s var(--ease), background-color 0.2s ease, color 0.2s ease; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { background: var(--ink); color: var(--bg); }
  .btn-quiet { background: var(--tone); }
  .btn-quiet:hover { background: var(--tone-2); }

  .nav { position: sticky; top: 0; z-index: 10; background: var(--bg); transition: background-color 0.4s ease; }
  .nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 72px; }
  .nav-mark img { height: 34px; width: auto; }
  html.dark .mark { filter: invert(1) brightness(1.05); }
  .nav-links { display: flex; align-items: center; gap: 8px; }
  .theme { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: var(--tone); transition: background-color 0.2s ease, transform 0.3s var(--ease); }
  .theme:hover { background: var(--tone-2); transform: rotate(14deg); }
  .theme span { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink); overflow: hidden; position: relative; transition: transform 0.6s var(--ease); } /* taste-skill-ignore: icon stroke, not a shadow */
  .theme span::after { content: ""; position: absolute; inset: 0 50% 0 0; background: var(--ink); }
  html.dark .theme span { transform: rotate(180deg); }

  main { padding: clamp(48px, 7vw, 96px) 0 clamp(80px, 10vw, 140px); }
  .head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: clamp(32px, 4vw, 56px); }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(56px, 8vw, 112px); letter-spacing: -0.04em; line-height: 0.95; }
  .head p { color: var(--muted); max-width: 36ch; }
  /* the sheet is always paper-white, in either theme */
  .sheet { background: var(--tone); padding: clamp(12px, 3vw, 40px); }
  .sheet img { width: 100%; max-width: 900px; height: auto; margin: 0 auto; background: #ffffff; }
  .after { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }

  @media (max-width: 560px) { .nav-links .back-label { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }
</style>
<script>try { if (sessionStorage.getItem('nds-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="nav-mark" href="index.html" aria-label="Nathan Setaro, home"><img class="mark" src="assets/nds-mark.png" alt="" width="34" height="34"></a>
    <nav class="nav-links" aria-label="Resume">
      <a class="btn btn-quiet" href="index.html" aria-label="Back to site">← <span class="back-label">Back to site</span></a>
      <a class="btn btn-primary" href="assets/resume.pdf" download="Nathan Setaro Resume.pdf">Download PDF</a>
      <button class="theme" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><span aria-hidden="true"></span></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <h1>Resume</h1>
    <p>One page. Download the PDF for a copy with selectable text.</p>
  </div>
  <div class="sheet">
    <img src="assets/resume.png" width="1500" height="1941" alt="Nathan Setaro's one-page resume: education at Auburn University and Worcester Technical High School, experience at National Grid, Machado Consulting, the MedHigh program and the Worcester Tech IT team, projects, skills, certifications, awards and volunteer work. Download the PDF for a text version.">
  </div>
  <div class="after">
    <a class="btn btn-primary" href="assets/resume.pdf" download="Nathan Setaro Resume.pdf">Download PDF</a>
    <a class="btn btn-quiet" href="assets/resume.pdf" target="_blank" rel="noopener">Open in a new tab</a>
  </div>
</main>

<script>
(function () {
  var root = document.documentElement;
  var isDark = root.classList.contains('dark');
  var tgl = document.getElementById('theme-toggle');
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  function sync() {
    root.classList.toggle('dark', isDark);
    tgl.setAttribute('aria-pressed', String(isDark));
    tgl.setAttribute('aria-label', 'Switch to ' + (isDark ? 'light' : 'dark') + ' mode');
    themeMeta.setAttribute('content', isDark ? '#06161d' : '#ffffff');
  }
  sync();
  tgl.addEventListener('click', function () {
    isDark = !isDark;
    try { sessionStorage.setItem('nds-theme', isDark ? 'dark' : 'light'); } catch (e) {}
    sync();
  });
})();
</script>
</body>
</html>
